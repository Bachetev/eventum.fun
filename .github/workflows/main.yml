name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install & build frontend
        working-directory: frontend
        run: |
          npm ci || npm i
          npm run build

      - name: Install backend deps
        working-directory: backend
        run: |
          npm ci || npm i
          node -e "console.log('backend deps ok')"
